name: Feature request
description: An idea for T2T Online.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the roadmap in the README first: it may already be planned.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you'd like, and when it would help.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: How you work around it now, if at all.
