# Runs the Core and Steam tests on Windows. The plugin isn't built here: it compiles against the game's interop
# assemblies, which only a machine with the game and MelonLoader has (docs/DEVELOPMENT.md, "Building").
# Every action is pinned by its full commit SHA (the version is in the comment); Dependabot keeps them current.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The SDK is exactly the one global.json pins (rollForward is disabled); 6.0.x is the runtime the net6.0 test
      # run needs, the one MelonLoader hosts the mod on.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 6.0.x
      - name: Restore in locked mode (packages.lock.json must be current)
        run: |
          dotnet restore tests/T2TOnline.Core.Tests --locked-mode
          dotnet restore tests/T2TOnline.Steam.Tests --locked-mode
      - name: Core tests (net8.0 and net6.0)
        run: dotnet test tests/T2TOnline.Core.Tests -c Release --no-restore
      - name: Steam tests
        run: dotnet test tests/T2TOnline.Steam.Tests -c Release --no-restore
